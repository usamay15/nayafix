<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background square with rounded corners -->
  <rect width="100" height="100" rx="24" fill="url(#iconGrad)"/>
  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="98" height="50" rx="24" fill="rgba(255,255,255,0.06)"/>
  <!-- ن Nastaliq character, large and centered -->
  <text x="18" y="74" font-size="62" font-family="'Noto Nastaliq Urdu', 'Arial Unicode MS', serif" fill="white" filter="url(#glow)">ن</text>
</svg>
